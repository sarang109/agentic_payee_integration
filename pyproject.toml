[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.2.0"
description = "MERIDIAN: receiving-authority integrity for agent payments (reference implementation and PayeeBench)"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pillow>=10",
  "pyyaml>=6",
  "requests>=2.31",
  "dnspython>=2.6",
  "eth-account>=0.13",
  "tabulate>=0.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
agents = ["agentdojo==0.1.35"]
datasets = ["kaggle>=2.0"]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["meridian*", "payeebench*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
